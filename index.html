<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tripleS Cosmo Live-Clip 次數與時長統計 (by 月份)</title>
    <meta name="description" content="tripleS Cosmo Room Live Clip 各成員直播次數與總直播時長統計（支援月份篩選）">
    
    <!-- Google Fonts & Supabase JS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0d0f1d;
            --bg-card: rgba(22, 27, 46, 0.75);
            --bg-card-hover: rgba(33, 40, 68, 0.9);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
            padding-bottom: 60px;
        }

        /* 頂部 Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            background: rgba(13, 15, 29, 0.85);
            border-bottom: 1px solid var(--border-glass);
            padding: 16px 28px;
        }

        .header-container {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        .brand-title h1 {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-summary {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-pill strong {
            color: white;
            font-size: 0.95rem;
        }

        /* 月份篩選列 */
        .month-bar {
            max-width: 1240px;
            margin: 24px auto 0;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .month-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .month-chip {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .month-chip:hover, .month-chip.active {
            background: var(--accent-purple);
            color: white;
            border-color: var(--accent-purple);
            box-shadow: 0 0 14px rgba(139, 92, 246, 0.4);
        }

        /* 主區域 */
        .container {
            max-width: 1240px;
            margin: 24px auto;
            padding: 0 20px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 28px;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* 側邊欄：成員排行榜 */
        .sidebar-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(16px);
        }

        .sidebar-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sort-switch {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 2px;
        }

        .sort-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .sort-btn.active {
            background: var(--accent-purple);
            color: white;
        }

        .member-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: calc(100vh - 220px);
            overflow-y: auto;
            padding-right: 4px;
        }

        .member-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            padding: 10px 14px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .member-item:hover, .member-item.active {
            background: rgba(139, 92, 246, 0.2);
            border-color: var(--accent-purple);
            transform: translateX(4px);
        }

        .rank-num {
            font-size: 0.88rem;
            font-weight: 800;
            width: 22px;
            color: var(--text-muted);
            text-align: center;
        }

        .rank-1 { color: #f59e0b; }
        .rank-2 { color: #9ca3af; }
        .rank-3 { color: #b45309; }

        .member-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
        }

        .member-info {
            flex: 1;
        }

        .member-name-text {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .member-sub-info {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .clip-count-badge {
            text-align: right;
        }

        .badge-main {
            font-size: 1.05rem;
            font-weight: 800;
            color: #c084fc;
        }

        .badge-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        /* 右側：Live Clip 時間與影片紀錄牆 */
        .content-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 24px;
            backdrop-filter: blur(16px);
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .filter-title {
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 影片列表 */
        .clips-timeline {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .clip-row {
            display: flex;
            gap: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 16px;
            transition: all 0.2s;
            cursor: pointer;
            align-items: center;
        }

        .clip-row:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-purple);
        }

        .video-thumb {
            width: 140px;
            height: 90px;
            border-radius: 12px;
            background: #000;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .video-thumb video, .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay-mini {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        .duration-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .clip-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .clip-date {
            font-size: 0.85rem;
            color: #c084fc;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clip-participating-members {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .member-tag {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .member-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .clip-text-content {
            font-size: 0.9rem;
            color: #d1d5db;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 影片播放彈窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 7, 15, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            padding: 20px;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #121629;
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            width: 100%;
            max-width: 750px;
            overflow: hidden;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
        }

        .modal-video-box video {
            width: 100%;
            max-height: 450px;
            background: black;
            outline: none;
        }

        .modal-body {
            padding: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- 頂部 Header -->
    <header>
        <div class="header-container">
            <div class="brand">
                <div class="brand-logo"><i class="fa-solid fa-video"></i></div>
                <div class="brand-title">
                    <h1>tripleS Live-Clip 直播統計</h1>
                </div>
            </div>

            <div class="header-summary">
                <div class="stat-pill"><i class="fa-solid fa-clapperboard"></i> 總次數: <strong id="total-live-clips">0</strong> 次</div>
                <div class="stat-pill"><i class="fa-solid fa-clock"></i> 總時長: <strong id="total-live-duration">0 小時</strong></div>
                <div class="stat-pill"><i class="fa-solid fa-user-group"></i> 成員數: <strong id="total-members-count">0</strong> 位</div>
            </div>
        </div>
    </header>

    <!-- 月份與成員篩選列 -->
    <div class="month-bar" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <div class="month-label"><i class="fa-regular fa-calendar-days"></i> 月份篩選:</div>
            <div class="month-chip active" onclick="selectMonth(null)" id="chip-month-all">全部月份</div>
            <div id="month-chips-container" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
        </div>

        <div style="display:flex; align-items:center; gap:10px;">
            <div class="month-label"><i class="fa-solid fa-user"></i> 成員篩選:</div>
            <select id="member-dropdown" onchange="selectMember(this.value === 'all' ? null : this.value)" style="background:var(--bg-card); border:1px solid var(--border-glass); color:white; padding:8px 16px; border-radius:20px; font-size:0.88rem; outline:none; cursor:pointer; min-width:180px;">
                <option value="all">全體成員 (所有直播)</option>
            </select>
        </div>
    </div>

    <div class="container">
        <div class="main-layout">
            
            <!-- 側邊欄：成員次數/時長排行榜 -->
            <div class="sidebar-card">
                <div class="sidebar-title">
                    <span><i class="fa-solid fa-trophy" style="color:#f59e0b;"></i> 成員排行榜</span>
                    <div class="sort-switch">
                        <button class="sort-btn active" id="sort-count-btn" onclick="setSort('count')">依次數</button>
                        <button class="sort-btn" id="sort-duration-btn" onclick="setSort('duration')">依時長</button>
                    </div>
                </div>

                <div class="member-list" id="member-list-container">
                    <!-- 動態注入成員列表 -->
                </div>
            </div>

            <!-- 右側內容：Live Clip 時間與影片紀錄 -->
            <div class="content-card">
                <div class="content-header">
                    <div class="filter-title" id="current-filter-title">
                        <i class="fa-solid fa-clock-rotate-left"></i> 所有 Live-Clip 時間紀錄
                    </div>
                </div>

                <div class="clips-timeline" id="clips-timeline-container">
                    <!-- 動態注入影片列表 -->
                </div>
            </div>

        </div>
    </div>

    <!-- 影片播放器彈窗 Modal -->
    <div class="modal" id="video-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-video-box" id="modal-video-box"></div>
            <div class="modal-body">
                <div id="modal-date-text" style="color:#c084fc; font-weight:600; font-size:0.85rem; margin-bottom:8px;"></div>
                <div id="modal-tags" style="display:flex; gap:6px; margin-bottom:12px;"></div>
                <p id="modal-content-text" style="line-height:1.5; font-size:0.95rem; color:#e5e7eb;"></p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ojjxrqkexcumpapnecjz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_lA-gW3rOIF7X4hNiUGSCCQ_U_-0wOrv";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allLiveClips = [];
        let monthFilteredClips = [];
        let selectedMonth = null;
        let selectedMember = null;
        let sortBy = 'count'; // 'count' 或 'duration'
        let memberStats = [];

        // 格式化秒數為 小時/分鐘/秒 (完整保留秒數，不截斷)
        function formatDuration(seconds) {
            if (!seconds || seconds <= 0) return '0 秒';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;

            if (h > 0) {
                return `${h} 小時 ${m} 分 ${s} 秒`;
            }
            if (m > 0) {
                return `${m} 分 ${s} 秒`;
            }
            return `${s} 秒`;
        }

        async function init() {
            try {
                // 讀取 room_posts 中 kind == 'live-clip' 且排除 access_type == 'all'
                const { data, error } = await supabaseClient
                    .from('room_posts')
                    .select('*')
                    .eq('kind', 'live-clip')
                    .neq('access_type', 'all')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allLiveClips = data || [];

                buildMonthChips();
                applyMonthFilter();
            } catch (err) {
                console.error("載入失敗:", err);
                document.getElementById('clips-timeline-container').innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-circle-exclamation" style="font-size:36px;margin-bottom:12px;"></i>
                        <p>載入失敗: ${err.message}</p>
                    </div>
                `;
            }
        }

        // 建立動態月份晶片按鈕
        function buildMonthChips() {
            const months = new Set();
            allLiveClips.forEach(post => {
                if (post.created_at) {
                    const date = new Date(post.created_at);
                    const yyyyMm = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                    months.add(yyyyMm);
                }
            });

            const sortedMonths = Array.from(months).sort().reverse();
            const container = document.getElementById('month-chips-container');

            container.innerHTML = sortedMonths.map(m => {
                const [y, mm] = m.split('-');
                return `<div class="month-chip" id="chip-month-${m}" onclick="selectMonth('${m}')">${y}年${parseInt(mm)}月</div>`;
            }).join('');
        }

        // 選擇月份
        function selectMonth(monthStr) {
            selectedMonth = monthStr;
            document.querySelectorAll('.month-chip').forEach(el => el.classList.remove('active'));
            if (monthStr === null) {
                document.getElementById('chip-month-all').classList.add('active');
            } else {
                const chip = document.getElementById(`chip-month-${monthStr}`);
                if (chip) chip.classList.add('active');
            }

            applyMonthFilter();
        }

        // 切換排序方式
        function setSort(type) {
            sortBy = type;
            document.getElementById('sort-count-btn').classList.toggle('active', type === 'count');
            document.getElementById('sort-duration-btn').classList.toggle('active', type === 'duration');
            calculateMemberStats();
            renderSidebar();
        }

        // 應用月份篩選
        function applyMonthFilter() {
            if (selectedMonth) {
                monthFilteredClips = allLiveClips.filter(post => {
                    if (!post.created_at) return false;
                    const date = new Date(post.created_at);
                    const yyyyMm = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                    return yyyyMm === selectedMonth;
                });
            } else {
                monthFilteredClips = allLiveClips;
            }

            // 更新頂部總時長與總次數
            const totalSec = monthFilteredClips.reduce((sum, p) => sum + (p.duration || 0), 0);
            document.getElementById('total-live-clips').innerText = monthFilteredClips.length;
            document.getElementById('total-live-duration').innerText = formatDuration(totalSec);

            calculateMemberStats();
            renderSidebar();
            renderTimeline();
        }

        // 計算成員直播次數與總時長 (解析 videoItem.channels)
        function calculateMemberStats() {
            const counts = {};
            const durations = {};
            const meta = {};

            monthFilteredClips.forEach(post => {
                const postDuration = post.duration || 0;
                const channels = post.channels || [];

                if (channels.length === 0) {
                    const name = post.author_name || 'Artist';
                    counts[name] = (counts[name] || 0) + 1;
                    durations[name] = (durations[name] || 0) + postDuration;
                    if (!meta[name]) meta[name] = { avatar: post.author_avatar, color: '#8b5cf6' };
                } else {
                    channels.forEach(ch => {
                        const name = ch.name || post.author_name;
                        if (name) {
                            counts[name] = (counts[name] || 0) + 1;
                            durations[name] = (durations[name] || 0) + postDuration;
                            if (!meta[name]) {
                                meta[name] = {
                                    avatar: ch.profileImageUrl || post.author_avatar,
                                    color: ch.primaryColorHex || '#8b5cf6'
                                };
                            }
                        }
                    });
                }
            });

            memberStats = Object.entries(counts)
                .map(([name, count]) => ({
                    name,
                    count,
                    durationSec: durations[name] || 0,
                    avatar: meta[name] ? meta[name].avatar : '',
                    color: meta[name] ? meta[name].color : '#8b5cf6'
                }))
                .sort((a, b) => {
                    if (sortBy === 'duration') {
                        return b.durationSec - a.durationSec;
                    }
                    return b.count - a.count;
                });

            document.getElementById('total-members-count').innerText = memberStats.length;

            // 動態更新頂部成員下拉選單
            const dropdown = document.getElementById('member-dropdown');
            if (dropdown) {
                let optionsHtml = `<option value="all" ${selectedMember === null ? 'selected' : ''}>全體成員 (所有直播)</option>`;
                optionsHtml += memberStats.map(m => `
                    <option value="${m.name}" ${selectedMember === m.name ? 'selected' : ''}>${m.name} (${m.count} 次)</option>
                `).join('');
                dropdown.innerHTML = optionsHtml;
            }
        }

        // 渲染側邊欄成員排行榜
        function renderSidebar() {
            const container = document.getElementById('member-list-container');
            const totalSec = monthFilteredClips.reduce((sum, p) => sum + (p.duration || 0), 0);

            let html = `
                <div class="member-item ${selectedMember === null ? 'active' : ''}" onclick="selectMember(null)">
                    <div class="rank-num"><i class="fa-solid fa-users"></i></div>
                    <div class="member-info">
                        <div class="member-name-text">全體成員 (所有直播)</div>
                        <div class="member-sub-info">總時長: ${formatDuration(totalSec)}</div>
                    </div>
                    <div class="clip-count-badge">
                        <div class="badge-main">${monthFilteredClips.length} 次</div>
                    </div>
                </div>
            `;

            html += memberStats.map((m, idx) => `
                <div class="member-item ${selectedMember === m.name ? 'active' : ''}" onclick="selectMember('${m.name}')">
                    <div class="rank-num ${idx < 3 ? 'rank-' + (idx + 1) : ''}">${idx + 1}</div>
                    <img class="member-avatar" src="${m.avatar}" style="border-color:${m.color}" alt="${m.name}" onerror="this.src='https://via.placeholder.com/42'">
                    <div class="member-info">
                        <div class="member-name-text">${m.name}</div>
                        <div class="member-sub-info">時長: ${formatDuration(m.durationSec)}</div>
                    </div>
                    <div class="clip-count-badge">
                        <div class="badge-main" style="color:${m.color}">${m.count} 次</div>
                    </div>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        // 點擊選擇成員
        function selectMember(name) {
            selectedMember = name;

            // 同步下拉選單的值
            const dropdown = document.getElementById('member-dropdown');
            if (dropdown) {
                dropdown.value = name || 'all';
            }

            renderSidebar();
            renderTimeline();
        }

        // 渲染右側 Live-Clip 時間列表
        function renderTimeline() {
            const container = document.getElementById('clips-timeline-container');
            const titleEl = document.getElementById('current-filter-title');

            let monthText = selectedMonth ? `${selectedMonth.split('-')[0]}年${parseInt(selectedMonth.split('-')[1])}月` : '所有月份';
            if (selectedMember) {
                titleEl.innerHTML = `<i class="fa-solid fa-user-check"></i> ${selectedMember} 參與的 Live-Clip 紀錄 (${monthText})`;
            } else {
                titleEl.innerHTML = `<i class="fa-solid fa-clock-rotate-left"></i> Live-Clip 時間紀錄 (${monthText})`;
            }

            // 篩選包含選定成員的 Live-Clips
            const filteredClips = monthFilteredClips.filter(post => {
                if (!selectedMember) return true;
                const channels = post.channels || [];
                if (channels.length > 0) {
                    return channels.some(ch => ch.name === selectedMember);
                }
                return post.author_name === selectedMember;
            });

            if (filteredClips.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-video-slash" style="font-size:36px;margin-bottom:12px;"></i>
                        <p>尚無符合條件的 Live-Clip 紀錄</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredClips.map(post => {
                const dateStr = post.created_at ? new Date(post.created_at).toLocaleString('zh-TW', {
                    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', weekday: 'short'
                }) : '';

                const channels = post.channels || [];

                return `
                    <div class="clip-row">
                        <div class="clip-details">
                            <div class="clip-header-row" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                                <div class="clip-date"><i class="fa-regular fa-calendar"></i> ${dateStr}</div>
                                <div class="duration-pill" style="background:rgba(139, 92, 246, 0.2); color:#c084fc; border:1px solid rgba(139, 92, 246, 0.4); font-size:0.78rem; font-weight:700; padding:3px 10px; border-radius:12px; display:flex; align-items:center; gap:4px;">
                                    <i class="fa-solid fa-stopwatch"></i> 直播時長: ${formatDuration(post.duration)}
                                </div>
                            </div>
                            <div class="clip-text-content" style="margin-top:4px;">${post.content || 'Live 直播紀錄'}</div>
                            <div class="clip-participating-members" style="margin-top:6px;">
                                ${channels.map(ch => `
                                    <span class="member-tag" onclick="selectMember('${ch.name}')" style="cursor:pointer;" title="點擊篩選 ${ch.name}">
                                        <span class="member-dot" style="background:${ch.primaryColorHex || '#8b5cf6'}"></span>
                                        ${ch.name}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
