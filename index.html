<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tripleS Cosmo Dashboard | 直播 · 行程 · 官方公告</title>
    <meta name="description" content="tripleS Cosmo 綜合數據儀表板：即時統計直播次數與時長、藝人最新行程行事曆、官方公告與置頂規範資訊。">

    <!-- Google Fonts & Supabase JS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/fontawesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/solid.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/regular.min.css">

    <style>
* {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
            padding-bottom: 60px;
        }

        /* 頂部 Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            background: rgba(13, 15, 29, 0.85);
            border-bottom: 1px solid var(--border-glass);
            padding: 16px 28px;
        }

        .header-container {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        .brand-title h1 {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-summary {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-pill strong {
            color: white;
            font-size: 0.95rem;
        }

        .stat-label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        /* 月份篩選列 */
        .month-bar {
            max-width: 1240px;
            margin: 24px auto 0;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .month-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 10px;
        }
/* 主區域 */
        .container {
            max-width: 1240px;
            margin: 24px auto;
            padding: 0 20px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 28px;
        }

        .mobile-main-nav { display: none; }

        /* 手機版分頁切換列 */
        .mobile-tab-switch {
            display: none;
        }

                @media (max-width: 768px) {
            html, body {
                max-width: 100%;
                overflow-x: hidden;
            }

            header {
                width: 100%;
                padding: 12px 14px;
            }

            .header-container {
                width: 100%;
                max-width: 100%;
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .brand {
                width: 100%;
            }

            .brand-title h1 {
                font-size: 1.15rem;
                line-height: 1.3;
            }

            /* 手機版頂部導覽分頁頁籤：流暢橫向滾動 */
            .main-nav-tabs {
                display:none;
                width: 100%;
                overflow-x: auto;
                flex-wrap: nowrap !important;
                gap: 8px;
                padding-bottom: 4px;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }
            .mobile-main-nav { display:flex; position:relative; width:100%; margin-top: 10px; }
            .mobile-main-nav-trigger { width:100%; min-height:44px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px; border:1px solid #2a2d32; border-radius:10px; background:#181a1e; color:#f1f3f2; font:inherit; font-size:.9rem; font-weight:700; cursor:pointer; }
            .mobile-main-nav-trigger i:last-child { color:#9299a1; transition:transform .2s ease; }
            .mobile-main-nav.open .mobile-main-nav-trigger i:last-child { transform:rotate(180deg); }
            .mobile-main-nav-menu { display:none; position:absolute; z-index:20; top:calc(100% + 6px); left:0; right:0; padding:6px; border:1px solid #2a2d32; border-radius:12px; background:#181a1e; box-shadow:0 12px 28px rgba(0,0,0,.35); }
            .mobile-main-nav.open .mobile-main-nav-menu { display:grid; gap:4px; }
            .mobile-main-nav-option { min-height:44px; display:flex; align-items:center; gap:10px; width:100%; padding:9px 10px; border:0; border-radius:8px; background:transparent; color:#9299a1; font:inherit; font-size:.9rem; font-weight:700; text-align:left; cursor:pointer; }
            .mobile-main-nav-option:hover,.mobile-main-nav-option.active { background:#607fa0; color:#f1f3f2; }
            .main-nav-tabs::-webkit-scrollbar {
                display: none;
            }
            .nav-tab-btn {
                flex-shrink: 0;
                padding: 7px 14px;
                font-size: 0.82rem;
                white-space: nowrap;
            }

            /* 手機版頂部數據摘要 Pills：整齊網格適配 */
            .header-summary {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 6px;
            }

            .stat-pill {
                font-size: 0.72rem;
                padding: 6px 4px;
                justify-content: center;
                min-width: 0;
                overflow: hidden;
                text-align: center;
                flex-direction: column;
                gap: 2px;
            }

            .stat-pill strong {
                font-size: 0.85rem;
                white-space: nowrap;
            }

            .stat-pill:last-child {
                grid-column: 1 / -1;
            }

            .notice-summary .stat-pill:first-child { grid-column: 1 / -1; }

            /* 手機版篩選列 */
            .month-bar {
                flex-direction: column;
                align-items: stretch !important;
                gap: 10px !important;
                padding: 0 14px;
                margin-top: 12px;
            }

            .month-bar > div {
                width: 100%;
            }

            #member-dropdown, #month-dropdown, #schedule-status-dropdown {
                width: 100% !important;
                min-width: unset !important;
                font-size: 1rem !important; /* 防止 iOS 點擊輸入框自動放大 */
                padding: 10px 14px !important;
            }

            .filter-control {
                align-items: stretch;
                flex-direction: column;
                gap: 6px;
            }

            .container {
                padding: 0 12px;
                margin: 14px auto;
            }

            .mobile-tab-switch {
                display: flex;
                gap: 8px;
                margin-bottom: 14px;
                background: #181a1e;
                padding: 4px;
                border-radius: 12px;
                border: 1px solid #2a2d32;
            }

            .mobile-tab-btn {
                flex: 1;
                padding: 9px 0;
                border: none;
                background: transparent;
                color: #9299a1;
                font-size: 0.85rem;
                font-weight: 700;
                border-radius: 10px;
                cursor: pointer;
                transition: all 0.2s;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
            }

            .mobile-tab-btn.active {
                background: #607fa0;
                color: white;
                box-shadow: 0 0 10px rgba(96, 127, 160, 0.4);
            }

            .main-layout {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .sidebar-card {
                display: none;
                padding: 14px;
                border-radius: 14px;
                position: static;
            }

            .content-card {
                display: block;
                padding: 14px;
                border-radius: 14px;
            }

            .main-layout.show-leaderboard .sidebar-card {
                display: block !important;
            }

            .main-layout.show-leaderboard .content-card {
                display: none !important;
            }

            .member-list {
                max-height: calc(100vh - 260px);
            }

            .schedules-grid {
                grid-template-columns: 1fr !important;
                gap: 14px;
            }

            .schedule-card {
                padding: 16px;
                border-radius: 12px;
            }

            .notice-card {
                padding: 14px 16px;
                border-radius: 12px;
            }

            .notice-header { min-width: 0; flex-wrap: wrap; }
            .notice-date { min-width: 0; flex: 1 1 100%; overflow: visible; text-overflow: clip; white-space: normal; overflow-wrap: anywhere; }

            .clip-row {
                padding: 12px 14px;
                border-radius: 12px;
            }

            .clip-header-row {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 6px !important;
            }

            .duration-pill {
                flex-shrink: 0;
            }

            .clip-header-row, .clip-details { min-width: 0; width: 100%; }
            .clip-text-content.clip-content-line {
                display: block;
                -webkit-line-clamp: unset;
                -webkit-box-orient: initial;
                overflow: visible;
                white-space: normal;
                text-overflow: clip;
                overflow-wrap: anywhere;
                word-break: break-word;
            }
            .sched-card-top { min-width: 0; align-items: flex-start; }
            .sched-card-top { display: grid; grid-template-columns: minmax(0, 1fr) max-content; gap: 8px; }
            .sched-status-tag { justify-self: end; }
            @media (max-width: 390px) {
                .sched-card-top { grid-template-columns: 1fr; }
                .sched-status-tag { justify-self: start; }
            }
            .sched-date { min-width: 0; flex: 1 1 auto; overflow: visible; text-overflow: clip; white-space: normal; overflow-wrap: anywhere; word-break: break-word; }
            .sched-status-tag { flex: 0 0 auto; white-space: nowrap; }
            .main-layout, .content-card, .schedules-grid, .schedule-card { min-width: 0; max-width: 100%; }
            .sched-card-top, .sched-title, .sched-content, .sched-members-row, .sched-place { min-width: 0; max-width: 100%; }
            .sched-member-badge { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .clip-date { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .duration-pill { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .member-tag { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

            .content-meta {
                display: none;
            }

            /* 手機版彈窗 (Modal) 體驗升級 */
            body.modal-open { overflow: hidden; }

        .modal {
                padding: 12px;
                align-items: flex-end;
            }

            .modal-content {
                max-width: 100% !important;
                width: 100% !important;
                border-radius: 20px 20px 16px 16px;
                max-height: 90vh;
            }

            .modal-body {
                padding: 18px 16px;
            }

            .modal-top-meta {
                padding-right: 32px !important;
            }

            .close-modal {
                top: 12px;
                right: 12px;
                width: 34px;
                height: 34px;
            }
        }

        /* 側邊欄：成員排行榜 */
        .sidebar-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(16px);
            position: sticky;
            top: 92px;
            align-self: start;
        }

        .sidebar-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sort-switch {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 2px;
        }

        .sort-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .sort-btn.active {
            background: var(--accent-purple);
            color: white;
        }

        .member-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: calc(100vh - 220px);
            overflow-y: auto;
            padding-right: 4px;
        }

        .member-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            padding: 10px 14px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .member-item:hover, .member-item.active {
            background: rgba(139, 92, 246, 0.2);
            border-color: var(--accent-purple);
            transform: translateX(4px);
        }

        .rank-num {
            font-size: 0.88rem;
            font-weight: 800;
            width: 22px;
            color: var(--text-muted);
            text-align: center;
        }

        .rank-1 { color: #f59e0b; }
        .rank-2 { color: #9ca3af; }
        .rank-3 { color: #b45309; }

        .member-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
        }

        .member-info {
            flex: 1;
        }

        .member-name-text {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .member-sub-info {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .clip-count-badge {
            text-align: right;
        }

        .badge-main {
            font-size: 1.05rem;
            font-weight: 800;
            color: #c084fc;
        }

        .badge-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        /* 右側：直播紀錄 時間與影片紀錄牆 */
        .content-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 24px;
            backdrop-filter: blur(16px);
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .content-meta {
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        .filter-title {
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 影片列表 */
        .clips-timeline {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .clips-timeline > .clip-row + .clip-row {
            margin-top: 16px;
        }

        .clip-row {
            display: flex;
            gap: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 13px 16px;
            transition: all 0.2s;
            align-items: center;
        }

        .clip-row:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-purple);
        }
.clip-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .clip-date {
            font-size: 0.85rem;
            color: #c084fc;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clip-participating-members {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .member-tag {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .member-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .clip-text-content {
            font-size: 0.9rem;
            color: #d1d5db;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .clip-content-line {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .clip-member-summary {
            min-width: 0;
        }

        .load-more-wrap {
            display: flex;
            width: 100%;
            justify-content: center;
            align-items: center;
            padding-top: 4px;
        }

        .load-more-btn {
            display: block;
            margin-inline: auto;
            background: rgba(139, 92, 246, 0.16);
            border: 1px solid rgba(139, 92, 246, 0.5);
            border-radius: 12px;
            color: #d8b4fe;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            padding: 11px 18px;
        }

        .load-more-btn:hover {
            background: var(--accent-purple);
            color: white;
        }

        /* 影片與公告詳情彈窗 (Modal) */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 12, 16, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease-in-out;
            padding: 20px;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #181a1e;
            border: 1px solid #2a2d32;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            width: 100%;
            max-width: 780px;
            overflow: hidden;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #25282d;
            border: 1px solid #3b536a;
            color: #9299a1;
            font-size: 15px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .close-modal:hover {
            background: #607fa0;
            color: #ffffff;
            border-color: #607fa0;
        }

        .modal-video-box video {
            width: 100%;
            max-height: 450px;
            background: black;
            outline: none;
        }

        .modal-body {
            padding: 24px;
        }

        .modal-notice-title {
            padding-right: 52px;
            overflow-wrap: anywhere;
        }

        .copy-content-btn {
            background: #25282d;
            border: 1px solid #3b536a;
            color: #a9c4df;
            padding: 5px 14px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .copy-content-btn:hover {
            background: #607fa0;
            color: #ffffff;
            border-color: #607fa0;
            box-shadow: 0 0 10px rgba(96, 127, 160, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }


        /* Collection tracker palette: matte charcoal, steel blue, and a single signal green. */
        :root {
            --bg-dark: #0d0e10;
            --bg-card: #181a1e;
            --bg-card-hover: #202329;
            --border-glass: #2a2d32;
            --text-main: #f1f3f2;
            --text-muted: #9299a1;
            --accent-purple: #607fa0;
            --accent-pink: #607fa0;
        }

        body { background: #0d0e10; color: #f1f3f2; }
        header { background: #0d0e10; border-bottom-color: #2a2d32; }
        .brand-logo { background: #607fa0; color: #f1f3f2; }
        .brand-title h1 { color: #f1f3f2; }
        .stat-pill, #member-dropdown, .sort-switch {
            background: #181a1e !important;
            border-color: #2a2d32 !important;
            color: #9299a1 !important;
        }
        .stat-pill strong, #member-dropdown { color: #f1f3f2 !important; }
        .sort-btn.active, .mobile-tab-btn.active {
            background: #607fa0 !important;
            border-color: #607fa0 !important;
            color: #f1f3f2 !important;
        }
        .sidebar-card, .content-card { background: #181a1e; border-color: #2a2d32; }
        .member-item, .clip-row { background: #181a1e; border-color: #2a2d32; }
        .member-item:hover, .member-item.active, .clip-row:hover { background: #202329; border-color: #3a4148; }
        .clip-date, .badge-main { color: #8eacd0; }
        .clip-text-content { color: #d4d8dc; }

        function formatDuration(seconds) {
            if (!seconds || seconds <= 0) return '0 秒';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            if (h > 0) return `${h} 小時 ${m} 分 ${s} 秒`;
            if (m > 0) return `${m} 分 ${s} 秒`;
            return `${s} 秒`;
        }

        function formatSummaryDuration(seconds) {
            if (!seconds || seconds <= 0) return '0 小時';
            const hours = seconds / 3600;
            return `${hours >= 10 ? Math.round(hours) : hours.toFixed(1)} 小時`;
        }

            const root = document.getElementById('dashboard-container');

                    .from('room_posts')
                    .select('*')
                    .eq('kind', 'live-clip')
                    .neq('access_type', 'all')
                    .order('created_at', { ascending: false });

                    allLiveClips = liveData;
                    buildMonthChips();
                    applyMonthFilter();

                console.error("初始化載入失敗:", err);
            } finally {
                setLoading(false);
            }
        }

        // ===== 切換主頁籤 (Live 直播 vs. Schedules 行程 vs. Notices 公告) =====

            if (tab === 'schedules') {
                if (monthWrap) monthWrap.style.display = 'none';
                if (schedStatusWrap) schedStatusWrap.style.display = 'flex';
                if (memberWrap) memberWrap.style.display = 'flex';
                if (sidebarCard) sidebarCard.style.removeProperty('display');
                if (mainLayout) mainLayout.style.gridTemplateColumns = '';
            } else if (tab === 'notices') {
                if (monthWrap) monthWrap.style.display = 'none';
                if (schedStatusWrap) schedStatusWrap.style.display = 'none';
                if (memberWrap) memberWrap.style.display = 'none';
                if (sidebarCard) sidebarCard.style.display = 'none';
                if (mainLayout) mainLayout.style.gridTemplateColumns = '1fr';

                if (monthWrap) monthWrap.style.display = 'flex';
                if (schedStatusWrap) schedStatusWrap.style.display = 'none';
                if (memberWrap) memberWrap.style.display = 'flex';
                if (sidebarCard) sidebarCard.style.removeProperty('display');
                if (mainLayout) mainLayout.style.gridTemplateColumns = '';
            }

            // 右側內容容器顯示邏輯
            const clipsContainer = document.getElementById('clips-timeline-container');
            const schedContainer = document.getElementById('schedules-grid-container');

                if (clipsContainer) clipsContainer.style.display = 'none';
                if (schedContainer) schedContainer.style.display = 'grid';
                if (noticeContainer) noticeContainer.style.display = 'none';
                if (loadMoreWrap) loadMoreWrap.style.display = 'none';

                if (schedContainer) schedContainer.style.display = 'none';

        // ===== 📅 藝人行程 (Schedules) Supabase 資料與邏輯 =====
        async function fetchSchedules() {
            try {
                const { data, error } = await supabaseClient
                    .from('artist_schedules')
                    .select('*')
                    .order('start_at', { ascending: true });

                if (!error && data) {
                    allSchedules = data;
                    calculateScheduleMemberStats();
                    updateScheduleBadges();
                    if (activeNavTab === 'schedules') {
                        updateHeaderSummary();
                        updateMemberDropdown();
                        renderSidebar();
                        renderSchedules();
                    }
                }
            } catch (e) {
                console.warn("無法取得行程資料:", e);
            }
        }

        function updateScheduleBadges() {
            const now = new Date();
            const upcoming = allSchedules.filter(s => new Date(s.end_at || s.start_at) >= now);
            const badge = document.getElementById('upcoming-count-badge');
            if (badge) badge.innerText = upcoming.length;
        }

        function switchScheduleSubtab(subtab) {
            activeScheduleSubtab = subtab;
            const dropdown = document.getElementById('schedule-status-dropdown');
            if (dropdown) dropdown.value = subtab;
            renderSchedules();
        }

        // ===== 計算行程參演成員統計 =====
        function calculateScheduleMemberStats() {
            const counts = {};
            const meta = {};

            allSchedules.forEach(s => {
                const members = s.members || [];
                members.forEach(m => {
                    if (m.name) {
                        counts[m.name] = (counts[m.name] || 0) + 1;
                        if (!meta[m.name]) {
                            meta[m.name] = {
                                avatar: m.profileImageUrl || '',
                                color: '#607fa0'
                            };
                        }
                    }
                });
            });

            scheduleMemberStats = Object.entries(counts)
                .map(([name, count]) => ({
                    name,
                    count,
                    avatar: meta[name] ? meta[name].avatar : '',
                    color: meta[name] ? meta[name].color : '#607fa0'
                }))
                .sort((a, b) => b.count - a.count);
        }

        // ===== 動態更新頂部 Header Summary Pills =====
        function updateHeaderSummary() {
            const summaryBox = document.getElementById('header-summary-container');
            if (!summaryBox) return;

            summaryBox.classList.toggle('notice-summary', activeNavTab === 'notices');

            if (activeNavTab === 'schedules') {
                const now = new Date();
                const upcomingCount = allSchedules.filter(s => new Date(s.end_at || s.start_at) >= now).length;
                const pastCount = allSchedules.length - upcomingCount;

                summaryBox.innerHTML = `
                    <div class="stat-pill"><span class="stat-label"><i class="fa-regular fa-calendar-check"></i>總行程</span><strong>${allSchedules.length}</strong><span class="stat-unit">筆</span></div>

                    <div class="stat-pill"><span class="stat-label"><i class="fa-solid fa-clock-rotate-left"></i>已結束</span><strong>${pastCount}</strong><span class="stat-unit">筆</span></div>
                `;

        // ===== 動態更新成員下拉選單 =====
        function updateMemberDropdown() {
            const dropdown = document.getElementById('member-dropdown');
            if (!dropdown) return;

            const statsList = activeNavTab === 'schedules' ? scheduleMemberStats : memberStats;
            let optionsHtml = `<option value="all" ${selectedMember === null ? 'selected' : ''}>全體成員 (所有${activeNavTab === 'schedules' ? '行程' : '直播'})</option>`;
            optionsHtml += statsList.map(m => `
                <option value="${m.name}" ${selectedMember === m.name ? 'selected' : ''}>${m.name} (${m.count} ${activeNavTab === 'schedules' ? '場' : '次'})</option>

        // ===== 建立動態月份選單 =====
        function buildMonthChips() {
            const months = new Set();
            allLiveClips.forEach(post => {
                if (post.created_at) {
                    const date = new Date(post.created_at);
                    months.add(`${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`);
                }
            });

            const sortedMonths = Array.from(months).sort().reverse();
            const dropdown = document.getElementById('month-dropdown');
            if (dropdown) {
                dropdown.innerHTML = `<option value="all">所有月份</option>` + sortedMonths.map(m => {
                    const [y, mm] = m.split('-');
                    return `<option value="${m}">${y} 年 ${parseInt(mm)} 月</option>`;
                }).join('');
            }
        }

        function selectMonth(monthStr) {
            selectedMonth = monthStr;
            const dropdown = document.getElementById('month-dropdown');
            if (dropdown) dropdown.value = monthStr || 'all';
            applyMonthFilter();
        }

        function applyMonthFilter() {
            if (selectedMonth) {
                monthFilteredClips = allLiveClips.filter(post => {
                    if (!post.created_at) return false;
                    const date = new Date(post.created_at);
                    const yyyyMm = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                    return yyyyMm === selectedMonth;
                });
            } else {
                monthFilteredClips = allLiveClips;
            }

            calculateMemberStats();
            if (activeNavTab === 'live') {
                updateHeaderSummary();
                updateMemberDropdown();
                renderSidebar();
                renderTimeline({ reset: true });
            }
        }

        function setSort(type) {
            sortBy = type;
            document.getElementById('sort-count-btn').classList.toggle('active', type === 'count');
            document.getElementById('sort-duration-btn').classList.toggle('active', type === 'duration');
            calculateMemberStats();
            renderSidebar();
        }

        function calculateMemberStats() {
            const counts = {};
            const durations = {};
            const meta = {};

            monthFilteredClips.forEach(post => {
                const postDuration = post.duration || 0;
                const channels = post.channels || [];

                if (channels.length === 0) {
                    const name = post.author_name || 'Artist';
                    counts[name] = (counts[name] || 0) + 1;
                    durations[name] = (durations[name] || 0) + postDuration;
                    if (!meta[name]) meta[name] = { avatar: post.author_avatar, color: '#607fa0' };
                } else {
                    channels.forEach(ch => {
                        const name = ch.name || post.author_name;
                        if (name) {
                            counts[name] = (counts[name] || 0) + 1;
                            durations[name] = (durations[name] || 0) + postDuration;
                            if (!meta[name]) {
                                meta[name] = {
                                    avatar: ch.profileImageUrl || post.author_avatar,
                                    color: ch.primaryColorHex || '#607fa0'
                                };
                            }
                        }
                    });
                }
            });

            memberStats = Object.entries(counts)
                .map(([name, count]) => ({
                    name,
                    count,
                    durationSec: durations[name] || 0,
                    avatar: meta[name] ? meta[name].avatar : '',
                    color: meta[name] ? meta[name].color : '#607fa0'
                }))
                .sort((a, b) => {
                    if (sortBy === 'duration') return b.durationSec - a.durationSec;
                    return b.count - a.count;
                });
        }

        // ===== 點擊選擇成員 =====
        function selectMember(name) {

        // ===== 渲染右側 Live-Clip 時間列表 =====
        function loadMoreClips() {
            visibleClipCount += PAGE_SIZE;
            renderTimeline();
        }

        function renderTimeline({ reset = false } = {}) {
            const container = document.getElementById('clips-timeline-container');
            const titleEl = document.getElementById('current-filter-title');
            const resultCount = document.getElementById('timeline-result-count');
            const loadMoreButton = document.getElementById('load-more-clips');
            const monthText = selectedMonth ? `${selectedMonth.split('-')[0]}年${parseInt(selectedMonth.split('-')[1])}月` : '所有月份';

            if (titleEl) {
                titleEl.innerHTML = selectedMember
                    ? `<i class="fa-solid fa-user-check"></i> ${selectedMember} 參與的 直播紀錄 (${monthText})`
                    : `<i class="fa-solid fa-clock-rotate-left"></i> 直播紀錄 (${monthText})`;
            }

            const filteredClips = monthFilteredClips.filter(post => {
                if (!selectedMember) return true;
                const channels = post.channels || [];
                return channels.length > 0 ? channels.some(ch => ch.name === selectedMember) : post.author_name === selectedMember;
            });

            if (reset) visibleClipCount = PAGE_SIZE;
            const visibleClips = filteredClips.slice(0, visibleClipCount);
            if (resultCount) resultCount.textContent = `顯示 ${visibleClips.length} / ${filteredClips.length} 筆`;
            if (loadMoreButton) loadMoreButton.hidden = visibleClips.length >= filteredClips.length;

            if (filteredClips.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-video-slash" style="font-size:36px;margin-bottom:12px;"></i><p>尚無符合條件的 直播紀錄</p></div>`;
                return;
            }

            container.innerHTML = visibleClips.map(post => {
                const dateStr = post.created_at ? new Date(post.created_at).toLocaleString('zh-TW', {
                    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', weekday: 'short'
                }) : '';
                const channels = post.channels || [];
                const members = channels.length ? channels : [{ name: post.author_name || 'Artist', primaryColorHex: '#607fa0' }];

                return `
                    <article class="clip-row">

                                ${members.length > 3 ? `<span class="member-tag">+${members.length - 3}</span>` : ''}
                            </div>
                        </div>
                    </article>
                `;

        // ===== 依據韓國標準時間 (KST / Asia/Seoul) 格式化行程時間 =====
        function formatKSTScheduleTime(startAtIso, endAtIso) {
            if (!startAtIso) return '';
            const startD = new Date(startAtIso);
            const endD = endAtIso ? new Date(endAtIso) : null;
            const tz = 'Asia/Seoul';

            const startDayStr = startD.toLocaleDateString('zh-TW', {
                timeZone: tz,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                weekday: 'short'
            });

            const startTimeStr = startD.toLocaleTimeString('zh-TW', {
                timeZone: tz,
                hour12: true,
                hour: '2-digit',
                minute: '2-digit'
            });

            if (!endD) return `${startDayStr} ${startTimeStr} (KST)`;

            const endDayStr = endD.toLocaleDateString('zh-TW', {
                timeZone: tz,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                weekday: 'short'
            });

            const endTimeStr = endD.toLocaleTimeString('zh-TW', {
                timeZone: tz,
                hour12: true,
                hour: '2-digit',
                minute: '2-digit'
            });

            if (startDayStr === endDayStr) {
                return `${startDayStr} ${startTimeStr} ~ ${endTimeStr} (KST)`;
            } else {
                return `${startDayStr} ${startTimeStr} ~ ${endDayStr} ${endTimeStr} (KST)`;
            }
        }

        // ===== 渲染右側 Schedules 藝人行程卡片列表 =====
        function renderSchedules() {
            const container = document.getElementById('schedules-grid-container');
            const titleEl = document.getElementById('current-filter-title');
            const resultCount = document.getElementById('timeline-result-count');
            if (!container) return;

            const now = new Date();
            let filtered = allSchedules.filter(s => {
                const end = new Date(s.end_at || s.start_at);
                if (activeScheduleSubtab === 'upcoming') return end >= now;
                if (activeScheduleSubtab === 'past') return end < now;
                return true; // 'all'
            });

            if (selectedMember) {
                filtered = filtered.filter(s => {
                    const members = s.members || [];
                    return members.some(m => m.name === selectedMember);
                });
            }

            if (activeScheduleSubtab === 'upcoming') {
                filtered.sort((a, b) => new Date(a.start_at) - new Date(b.start_at));
            } else {
                // 'past' 或 'all' (全部行程): 從最新到最舊 (NEW to OLD / DESC) 排序
                filtered.sort((a, b) => new Date(b.start_at) - new Date(a.start_at));
            }

            if (titleEl) {
                let subTitle = '全部行程';
                if (activeScheduleSubtab === 'upcoming') subTitle = '即將到來行程';
                if (activeScheduleSubtab === 'past') subTitle = '過往歷史行程';

                titleEl.innerHTML = selectedMember
                    ? `<i class="fa-regular fa-calendar-check"></i> ${selectedMember} 參演的${subTitle}`
                    : `<i class="fa-regular fa-calendar-check"></i> tripleS 藝人行程 (${subTitle})`;
            }

            if (resultCount) {
                resultCount.textContent = `共 ${filtered.length} 筆行程`;
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;"><i class="fa-regular fa-calendar-xmark" style="font-size:36px;margin-bottom:12px;"></i><p>尚無符合條件的行程紀錄</p></div>`;
                return;
            }

            container.innerHTML = filtered.map(s => {
                const startD = new Date(s.start_at);
                const endD = new Date(s.end_at || s.start_at);
                // 依據韓國標準時間 (KST / Asia/Seoul) 精準格式化開始與結束時間
                const dateRangeStr = formatKSTScheduleTime(s.start_at, s.end_at);

                let statusTagHtml = '';
                const isEnded = endD < now;
                if (!isEnded) {
                    const diffDays = Math.ceil((startD - now) / (1000 * 60 * 60 * 24));
                    let dText = diffDays <= 0 ? '🔥 今日活動' : `D-${diffDays}`;
                    statusTagHtml = `<span class="sched-status-tag sched-status-upcoming">${dText}</span>`;
                } else {
                    statusTagHtml = `<span class="sched-status-tag sched-status-past">已結束</span>`;
                }

                const members = s.members || [];

                return `
                    <article class="schedule-card">
                        <div class="sched-card-top">
                            <div class="sched-date"><i class="fa-regular fa-clock"></i> ${dateRangeStr}</div>
                            ${statusTagHtml}
                        </div>
                        <div class="sched-title">${s.title}</div>
                        ${s.content && s.content !== s.title ? `<div class="sched-content">${s.content}</div>` : ''}
                        ${s.place ? `<div class="sched-place"><i class="fa-solid fa-location-dot"></i> ${s.place}</div>` : ''}
                        ${members.length > 0 ? `
                            <div class="sched-members-row">
                                ${members.map(m => `
                                    <span class="sched-member-badge" role="button" tabindex="0" onclick="selectMember('${m.name}')" style="cursor:pointer;" title="點擊篩選 ${m.name}">
                                        <img class="sched-member-avatar" src="${m.profileImageUrl || ''}" onerror="this.src='https://via.placeholder.com/22'" alt="${m.name}">
                                        ${m.name}
                                    </span>
                                `).join('')}
                            </div>
                        ` : ''}
                    </article>
                `;
            }).join('');
        }


        // ============================================================
        // 📢 官方公告 (Notices) Supabase 資料抓取與渲染邏輯
        // ============================================================
        let allNotices = [];

        async function fetchNotices() {
            try {
                const { data, error } = await supabaseClient
                    .from('notices')
                    .select('*')
                    .order('is_pinned', { ascending: false })
                    .order('order_index', { ascending: true })
                    .order('created_at', { ascending: false });

                if (!error && data) {
                    allNotices = data;
                    if (activeNavTab === 'notices') {
                        updateHeaderSummary();
                        renderNotices();
                    }
                }
            } catch (e) {
                console.warn("無法取得公告資料:", e);
            }
        }

        function renderNotices() {
            const container = document.getElementById('notices-timeline-container');
            const titleEl = document.getElementById('current-filter-title');
            const resultCount = document.getElementById('timeline-result-count');
            if (!container) return;

            if (titleEl) {
                titleEl.innerHTML = `<i class="fa-solid fa-bullhorn"></i> tripleS 官方公告與聲明 (${allNotices.length} 則)`;
            }

            if (resultCount) {
                resultCount.textContent = `共 ${allNotices.length} 則公告`;
            }

            if (allNotices.length === 0) {
                container.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;"><i class="fa-solid fa-circle-exclamation" style="font-size:36px;margin-bottom:12px;"></i><p>尚無官方公告紀錄</p></div>`;
                return;
            }

            container.innerHTML = allNotices.map(n => {
                const dateStr = n.created_at ? new Date(n.created_at).toLocaleString('zh-TW', {
                    timeZone: 'Asia/Seoul',
                    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
                }) + ' (KST)' : '';

                const cleanTitle = (n.title || '').replace('[PINNED]', '').trim();

                return `
                    <article class="notice-card ${n.is_pinned ? 'is-pinned' : ''}" role="button" tabindex="0" onclick="openNoticeModal(${n.id})">
                        <div class="notice-card-body">
                            <div class="notice-header">
                                <div class="notice-date"><i class="fa-regular fa-clock"></i> ${dateStr}</div>
                                ${n.is_pinned ? `<span class="notice-pinned-badge"><i class="fa-solid fa-thumbtack"></i> 置頂公告</span>` : ''}
                            </div>
                            <div class="notice-title">${cleanTitle}</div>
                        </div>
                        <div class="notice-arrow">
                            <i class="fa-solid fa-chevron-right"></i>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function closeModal() {
            const modal = document.getElementById('video-modal');
            const videoBox = document.getElementById('modal-video-box');
            if (videoBox) videoBox.innerHTML = '';
            if (modal) modal.classList.remove('open');
            document.body.classList.remove('modal-open');
        }

        function linkifyText(text) {
            if (!text) return '';
            const urlRegex = /(https?:\/\/[^\s<]+|www\.[^\s<]+)/g;
            return text.replace(urlRegex, (url) => {
                const href = url.startsWith('http') ? url : `https://${url}`;
                return `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color:#a9c4df; background:rgba(96, 127, 160, 0.15); border:1px solid rgba(96, 127, 160, 0.3); padding:3px 10px; border-radius:6px; text-decoration:none; font-weight:600; display:inline-flex; align-items:center; gap:6px; word-break:break-all; transition:all 0.2s;"><i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.75rem;"></i>${url}</a>`;
            });
        }

        let currentNoticeContentForCopy = "";

        function copyModalContent() {
            if (!currentNoticeContentForCopy) return;
            navigator.clipboard.writeText(currentNoticeContentForCopy).then(() => {
                const btn = document.getElementById('copy-modal-content-btn');
                if (btn) {
                    btn.innerHTML = '<i class="fa-solid fa-check" style="color:#34d399;"></i> 已複製！';
                    btn.style.borderColor = '#34d399';
                    btn.style.color = '#34d399';
                    setTimeout(() => {
                        btn.innerHTML = '<i class="fa-regular fa-copy"></i> 複製內文';
                        btn.style.borderColor = '#3b536a';
                        btn.style.color = '#a9c4df';
                    }, 2000);
                }
            }).catch(err => {
                console.error("複製失敗:", err);
            });
        }

        function openNoticeModal(noticeId) {
            const notice = allNotices.find(n => String(n.id) === String(noticeId));
            if (!notice) return;

            currentNoticeContentForCopy = notice.content || notice.title;

            const modal = document.getElementById('video-modal');
            const videoBox = document.getElementById('modal-video-box');
            const dateText = document.getElementById('modal-date-text');
            const tagsBox = document.getElementById('modal-tags');
            const contentText = document.getElementById('modal-content-text');
            const copyBtn = document.getElementById('copy-modal-content-btn');

            if (copyBtn) copyBtn.style.display = 'inline-flex';

            if (videoBox) {
                videoBox.style.display = 'none';
                videoBox.innerHTML = '';
            }
            if (dateText) {
                const dateStr = notice.created_at ? new Date(notice.created_at).toLocaleString('zh-TW', {
                    timeZone: 'Asia/Seoul',
                    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
                }) + ' (KST)' : '';
                dateText.style.color = '#8eacd0';
                dateText.style.fontSize = '0.85rem';
                dateText.style.fontWeight = '600';
                dateText.style.marginBottom = '0';
                dateText.innerHTML = `<i class="fa-solid fa-bullhorn" style="color:#607fa0;"></i> ${notice.is_pinned ? '<span style="color:#f59e0b; font-weight:800; margin-right:4px;">[📌 置頂公告]</span>' : ''}${dateStr}`;
            }

            if (tagsBox) {
                tagsBox.innerHTML = `
                    <div class="modal-notice-title" style="font-size:1.15rem; font-weight:700; color:#f1f3f2; line-height:1.4; margin-bottom:16px; border-bottom:1px solid #2a2d32; padding-bottom:12px;">
                        ${notice.title}
                    </div>
                `;
            }

            if (contentText) {
                const rawContent = notice.content || notice.title;
                const formattedContent = linkifyText(rawContent);

                const images = notice.image_url_list || notice.imageUrlList || [];
                let imagesHtml = '';
                if (Array.isArray(images) && images.length > 0) {
                    imagesHtml = `
                        <div class="notice-images-gallery" style="margin-top:24px; display:flex; flex-direction:column; gap:16px; align-items:center;">
                            ${images.map(imgUrl => `
                                <img src="${imgUrl}" style="max-width:100%; border-radius:12px; border:1px solid #2a2d32; box-shadow:0 6px 20px rgba(0,0,0,0.5);" alt="Notice Attachment" loading="lazy">
                            `).join('')}
                        </div>
                    `;
                }

                contentText.innerHTML = `<div style="white-space: pre-wrap; font-size: 0.96rem; line-height: 1.75; color: #d1d5db; max-height: 65vh; overflow-y: auto; padding-right: 8px;">${formattedContent}${imagesHtml}</div>`;
            }

            if (modal) {
                modal.classList.add('open');
                document.body.classList.add('modal-open');
            }
        }

        window.addEventListener('click', (e) => {
            const modal = document.getElementById('video-modal');
            if (e.target === modal) {
                closeModal();
            }
        });

        // ===== 手機版分頁切換 =====
        function toggleMobileMainNav() {
            const menu = document.getElementById('mobile-main-nav');
            const trigger = document.getElementById('mobile-main-nav-trigger');
            if (!menu || !trigger) return;
            const isOpen = menu.classList.toggle('open');
            trigger.setAttribute('aria-expanded', String(isOpen));
        }

        function switchMobileTab(tab) {
            const layout = document.getElementById('main-layout');
            const btnTimeline = document.getElementById('mtab-timeline');
            const btnLeaderboard = document.getElementById('mtab-leaderboard');

            if (tab === 'leaderboard') {
                if (layout) layout.classList.add('show-leaderboard');
                if (btnLeaderboard) btnLeaderboard.classList.add('active');
                if (btnTimeline) btnTimeline.classList.remove('active');
            } else {
                if (layout) layout.classList.remove('show-leaderboard');
                if (btnTimeline) btnTimeline.classList.add('active');
                if (btnLeaderboard) btnLeaderboard.classList.remove('active');
            }
        }


        document.addEventListener('keydown', (event) => {
            const target = event.target;
            if (!target.matches('.member-tag, .sched-member-badge, .notice-card')) return;
            if (event.key !== 'Enter' && event.key !== ' ') return;
            event.preventDefault();
            target.click();
        });
        window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
