<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tripleS Cosmo Live-Clip 次數與時長統計 (by 月份)</title>
    <meta name="description" content="tripleS Cosmo Room Live Clip 各成員直播次數與總直播時長統計（支援月份篩選）">
    
    <!-- Google Fonts & Supabase JS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0d0f1d;
            --bg-card: rgba(22, 27, 46, 0.75);
            --bg-card-hover: rgba(33, 40, 68, 0.9);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
            padding-bottom: 60px;
        }

        /* 頂部 Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            background: rgba(13, 15, 29, 0.85);
            border-bottom: 1px solid var(--border-glass);
            padding: 16px 28px;
        }

        .header-container {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        .brand-title h1 {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-summary {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-pill strong {
            color: white;
            font-size: 0.95rem;
        }

        /* 月份篩選列 */
        .month-bar {
            max-width: 1240px;
            margin: 24px auto 0;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .month-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .month-chip {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .month-chip:hover, .month-chip.active {
            background: var(--accent-purple);
            color: white;
            border-color: var(--accent-purple);
            box-shadow: 0 0 14px rgba(139, 92, 246, 0.4);
        }

        /* 主區域 */
        .container {
            max-width: 1240px;
            margin: 24px auto;
            padding: 0 20px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 28px;
        }

        /* 手機版分頁切換列 */
        .mobile-tab-switch {
            display: none;
        }

        @media (max-width: 768px) {
            html, body {
                max-width: 100%;
                overflow-x: hidden;
            }

            header {
                width: 100%;
                padding: 12px 16px;
            }

            .header-container {
                width: 100%;
                max-width: 100%;
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .brand-title h1 {
                font-size: 1.15rem;
            }

            .header-summary {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 6px;
            }

            .stat-pill {
                font-size: 0.75rem;
                padding: 7px 8px;
                justify-content: center;
                min-width: 0;
                overflow: hidden;
            }

            .stat-pill strong {
                font-size: 0.9rem;
                white-space: nowrap;
            }

            .stat-pill:last-child {
                grid-column: 1 / -1;
            }

            .month-bar {
                flex-direction: column;
                align-items: stretch !important;
                gap: 12px !important;
                padding: 0 16px;
                margin-top: 14px;
            }

            .month-bar > div {
                width: 100%;
            }

            #month-chips-container {
                overflow-x: auto;
                flex-wrap: nowrap !important;
                padding-bottom: 4px;
                -webkit-overflow-scrolling: touch;
            }

            #member-dropdown, #month-dropdown {
                width: 100% !important;
                min-width: unset !important;
                font-size: 1rem !important; /* 避免 iOS 手機點擊時自動放大畫面 */
                padding: 10px 14px !important;
            }

            .filter-control {
                align-items: stretch;
                flex-direction: column;
                gap: 6px;
            }

            .container {
                padding: 0 14px;
                margin: 16px auto;
            }

            .mobile-tab-switch {
                display: flex;
                gap: 8px;
                margin-bottom: 16px;
                background: var(--bg-card);
                padding: 4px;
                border-radius: 14px;
                border: 1px solid var(--border-glass);
            }

            .mobile-tab-btn {
                flex: 1;
                padding: 10px 0;
                border: none;
                background: transparent;
                color: var(--text-muted);
                font-size: 0.9rem;
                font-weight: 700;
                border-radius: 10px;
                cursor: pointer;
                transition: all 0.2s;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
            }

            .mobile-tab-btn.active {
                background: var(--accent-purple);
                color: white;
                box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
            }

            .main-layout {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            /* 手機版分頁切換：預設顯示時間紀錄，隱藏排行榜 */
            .sidebar-card {
                display: none;
                padding: 16px;
                border-radius: 20px;
            }

            .content-card {
                display: block;
                padding: 16px;
                border-radius: 20px;
            }

            /* 當切換到排行榜模式時 */
            .main-layout.show-leaderboard .sidebar-card {
                display: block !important;
            }

            .main-layout.show-leaderboard .content-card {
                display: none !important;
            }

            .member-list {
                max-height: calc(100vh - 280px); /* 手機版排行榜獨佔頁面 */
            }

            .clip-row {
                padding: 12px 14px;
                border-radius: 14px;
            }

            .clip-header-row {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 6px !important;
            }

            .duration-pill {
                flex-shrink: 0;
            }

            .content-meta {
                display: none;
            }

            .sidebar-card {
                position: static;
            }
        }

        /* 側邊欄：成員排行榜 */
        .sidebar-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(16px);
            position: sticky;
            top: 92px;
            align-self: start;
        }

        .sidebar-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sort-switch {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 2px;
        }

        .sort-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .sort-btn.active {
            background: var(--accent-purple);
            color: white;
        }

        .member-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: calc(100vh - 220px);
            overflow-y: auto;
            padding-right: 4px;
        }

        .member-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            padding: 10px 14px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .member-item:hover, .member-item.active {
            background: rgba(139, 92, 246, 0.2);
            border-color: var(--accent-purple);
            transform: translateX(4px);
        }

        .rank-num {
            font-size: 0.88rem;
            font-weight: 800;
            width: 22px;
            color: var(--text-muted);
            text-align: center;
        }

        .rank-1 { color: #f59e0b; }
        .rank-2 { color: #9ca3af; }
        .rank-3 { color: #b45309; }

        .member-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
        }

        .member-info {
            flex: 1;
        }

        .member-name-text {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .member-sub-info {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .clip-count-badge {
            text-align: right;
        }

        .badge-main {
            font-size: 1.05rem;
            font-weight: 800;
            color: #c084fc;
        }

        .badge-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        /* 右側：Live Clip 時間與影片紀錄牆 */
        .content-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 24px;
            backdrop-filter: blur(16px);
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .content-meta {
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        .filter-title {
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 影片列表 */
        .clips-timeline {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .clip-row {
            display: flex;
            gap: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 13px 16px;
            transition: all 0.2s;
            align-items: center;
        }

        .clip-row:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-purple);
        }

        .video-thumb {
            width: 140px;
            height: 90px;
            border-radius: 12px;
            background: #000;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .video-thumb video, .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay-mini {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        .duration-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .clip-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .clip-date {
            font-size: 0.85rem;
            color: #c084fc;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clip-participating-members {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .member-tag {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .member-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .clip-text-content {
            font-size: 0.9rem;
            color: #d1d5db;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .clip-content-line {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .clip-member-summary {
            min-width: 0;
        }

        .load-more-wrap {
            display: flex;
            justify-content: center;
            padding-top: 4px;
        }

        .load-more-btn {
            background: rgba(139, 92, 246, 0.16);
            border: 1px solid rgba(139, 92, 246, 0.5);
            border-radius: 12px;
            color: #d8b4fe;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            padding: 11px 18px;
        }

        .load-more-btn:hover {
            background: var(--accent-purple);
            color: white;
        }

        /* 影片播放彈窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 7, 15, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            padding: 20px;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #121629;
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            width: 100%;
            max-width: 750px;
            overflow: hidden;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
        }

        .modal-video-box video {
            width: 100%;
            max-height: 450px;
            background: black;
            outline: none;
        }

        .modal-body {
            padding: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        /* Editorial archive theme: warm paper, ink, and a restrained evergreen accent. */
        :root {
            --bg-dark: #f4f1ea;
            --bg-card: #fffdf8;
            --bg-card-hover: #f0eee5;
            --border-glass: #d9d7cc;
            --text-main: #1d2924;
            --text-muted: #68736b;
            --accent-purple: #315b48;
            --accent-pink: #a65c48;
        }

        body {
            background: var(--bg-dark);
            background-image: none;
            color: var(--text-main);
            font-family: 'Noto Sans TC', sans-serif;
        }

        header {
            background: rgba(244, 241, 234, 0.96);
            backdrop-filter: none;
            border-bottom-color: #d9d7cc;
        }

        .brand-logo {
            background: #315b48;
            border-radius: 8px;
            box-shadow: none;
        }

        .brand-title h1 {
            color: #1d2924;
            font-family: Georgia, 'Noto Serif TC', serif;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: none;
            -webkit-text-fill-color: currentColor;
        }

        .stat-pill, .month-chip, #member-dropdown, .sort-switch {
            background: #fffdf8 !important;
            border-color: #d9d7cc !important;
            box-shadow: none !important;
            color: #526158 !important;
        }

        .stat-pill strong, #member-dropdown { color: #1d2924 !important; }
        .month-chip { border-radius: 8px; }
        .month-chip:hover, .month-chip.active, .sort-btn.active, .mobile-tab-btn.active {
            background: #315b48 !important;
            border-color: #315b48 !important;
            box-shadow: none !important;
            color: #fffdf8 !important;
        }

        .sidebar-card, .content-card {
            background: #fffdf8;
            border-color: #d9d7cc;
            border-radius: 12px;
            box-shadow: none;
            backdrop-filter: none;
        }

        .member-item, .clip-row {
            background: transparent;
            border-color: #e4e1d8;
            border-radius: 8px;
        }

        .member-item:hover, .member-item.active, .clip-row:hover {
            background: #edf1eb;
            border-color: #8eaa9b;
            transform: none;
        }

        .clip-date, .badge-main { color: #315b48; }
        .clip-text-content { color: #4f5b53; }
        .duration-pill {
            background: #edf1eb !important;
            color: #315b48 !important;
            border-color: #b9c9bd !important;
        }

        .member-tag {
            background: #f0eee7;
            border-color: #d9d7cc;
            border-radius: 6px;
            color: #405047;
        }

        .load-more-btn {
            background: #315b48;
            border-color: #315b48;
            border-radius: 8px;
            box-shadow: none;
            color: #fffdf8;
        }

        .load-more-btn:hover { background: #244535; }

        /* Collection tracker palette: matte charcoal, steel blue, and a single signal green. */
        :root {
            --bg-dark: #0d0e10;
            --bg-card: #181a1e;
            --bg-card-hover: #202329;
            --border-glass: #2a2d32;
            --text-main: #f1f3f2;
            --text-muted: #9299a1;
            --accent-purple: #607fa0;
            --accent-pink: #607fa0;
        }

        body { background: #0d0e10; color: #f1f3f2; }
        header { background: #0d0e10; border-bottom-color: #2a2d32; }
        .brand-logo { background: #607fa0; color: #f1f3f2; }
        .brand-title h1 { color: #f1f3f2; }
        .stat-pill, .month-chip, #member-dropdown, .sort-switch {
            background: #181a1e !important;
            border-color: #2a2d32 !important;
            color: #9299a1 !important;
        }
        .stat-pill strong, #member-dropdown { color: #f1f3f2 !important; }
        .month-chip:hover, .month-chip.active, .sort-btn.active, .mobile-tab-btn.active {
            background: #607fa0 !important;
            border-color: #607fa0 !important;
            color: #f1f3f2 !important;
        }
        .sidebar-card, .content-card { background: #181a1e; border-color: #2a2d32; }
        .member-item, .clip-row { background: #181a1e; border-color: #2a2d32; }
        .member-item:hover, .member-item.active, .clip-row:hover { background: #202329; border-color: #3a4148; }
        .clip-date, .badge-main { color: #8eacd0; }
        .clip-text-content { color: #d4d8dc; }
        .duration-pill { background: #202a34 !important; color: #a9c4df !important; border-color: #3b536a !important; }
        .member-tag { background: #25282d; border-color: #383c42; color: #d4d8dc; }
        .load-more-btn { background: #607fa0; border-color: #607fa0; color: #f1f3f2; }
        .load-more-btn:hover { background: #7896b5; }
        .filters-bar { justify-content: flex-start; gap: 12px; }
        .filter-control { display: flex; align-items: center; gap: 8px; }
        .filter-control select {
            min-width: 190px;
            padding: 9px 34px 9px 12px;
            border: 1px solid #2a2d32;
            border-radius: 8px;
            background: #181a1e;
            color: #f1f3f2;
            font: inherit;
            outline: none;
        }
        .filter-control select:focus { border-color: #607fa0; }
    </style>
</head>
<body>

    <!-- 頂部 Header -->
    <header>
        <div class="header-container">
            <div class="brand">
                <div class="brand-logo"><i class="fa-solid fa-video"></i></div>
                <div class="brand-title">
                    <h1>tripleS Live-Clip 直播統計</h1>
                </div>
            </div>

            <div class="header-summary">
                <div class="stat-pill"><i class="fa-solid fa-clapperboard"></i> 總次數: <strong id="total-live-clips">0</strong> 次</div>
                <div class="stat-pill"><i class="fa-solid fa-clock"></i> 總時長: <strong id="total-live-duration">0 小時</strong></div>
                <div class="stat-pill"><i class="fa-solid fa-user-group"></i> 成員數: <strong id="total-members-count">0</strong> 位</div>
            </div>
        </div>
    </header>

    <!-- 月份與成員篩選列 -->
    <div class="month-bar filters-bar">
        <div class="filter-control">
            <label class="month-label" for="month-dropdown"><i class="fa-regular fa-calendar-days"></i> 月份</label>
            <select id="month-dropdown" onchange="selectMonth(this.value === 'all' ? null : this.value)">
                <option value="all">所有月份</option>
            </select>
        </div>

        <div class="filter-control">
            <label class="month-label" for="member-dropdown"><i class="fa-solid fa-user"></i> 成員</label>
            <select id="member-dropdown" onchange="selectMember(this.value === 'all' ? null : this.value)">
                <option value="all">全體成員（所有直播）</option>
            </select>
        </div>
    </div>

    <div class="container">

        <!-- 手機版專屬分頁切換列 -->
        <div class="mobile-tab-switch">
            <button class="mobile-tab-btn active" id="mtab-timeline" onclick="switchMobileTab('timeline')">
                <i class="fa-solid fa-clock-rotate-left"></i> 直播時間紀錄
            </button>
            <button class="mobile-tab-btn" id="mtab-leaderboard" onclick="switchMobileTab('leaderboard')">
                <i class="fa-solid fa-trophy"></i> 成員排行榜
            </button>
        </div>

        <div class="main-layout" id="main-layout">
            
            <!-- 側邊欄：成員次數/時長排行榜 -->
            <div class="sidebar-card">
                <div class="sidebar-title">
                    <span><i class="fa-solid fa-trophy" style="color:#f59e0b;"></i> 成員排行榜</span>
                    <div class="sort-switch">
                        <button class="sort-btn active" id="sort-count-btn" onclick="setSort('count')">依次數</button>
                        <button class="sort-btn" id="sort-duration-btn" onclick="setSort('duration')">依時長</button>
                    </div>
                </div>

                <div class="member-list" id="member-list-container">
                    <!-- 動態注入成員列表 -->
                </div>
            </div>

            <!-- 右側內容：Live Clip 時間與影片紀錄 -->
            <div class="content-card">
                <div class="content-header">
                    <div class="filter-title" id="current-filter-title">
                        <i class="fa-solid fa-clock-rotate-left"></i> 所有 Live-Clip 時間紀錄
                    </div>
                    <div class="content-meta" id="timeline-result-count" aria-live="polite"></div>
                </div>

                <div class="clips-timeline" id="clips-timeline-container">
                    <!-- 動態注入影片列表 -->
                </div>
                <div class="load-more-wrap">
                    <button class="load-more-btn" id="load-more-clips" type="button" onclick="loadMoreClips()" hidden>載入更多</button>
                </div>
            </div>

        </div>
    </div>

    <!-- 影片播放器彈窗 Modal -->
    <div class="modal" id="video-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-video-box" id="modal-video-box"></div>
            <div class="modal-body">
                <div id="modal-date-text" style="color:#c084fc; font-weight:600; font-size:0.85rem; margin-bottom:8px;"></div>
                <div id="modal-tags" style="display:flex; gap:6px; margin-bottom:12px;"></div>
                <p id="modal-content-text" style="line-height:1.5; font-size:0.95rem; color:#e5e7eb;"></p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ojjxrqkexcumpapnecjz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_lA-gW3rOIF7X4hNiUGSCCQ_U_-0wOrv";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allLiveClips = [];
        let monthFilteredClips = [];
        let selectedMonth = null;
        let selectedMember = null;
        let sortBy = 'count'; // 'count' 或 'duration'
        let memberStats = [];
        const PAGE_SIZE = 40;
        let visibleClipCount = PAGE_SIZE;

        // 格式化秒數為 小時/分鐘/秒 (完整保留秒數，不截斷)
        function formatDuration(seconds) {
            if (!seconds || seconds <= 0) return '0 秒';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;

            if (h > 0) {
                return `${h} 小時 ${m} 分 ${s} 秒`;
            }
            if (m > 0) {
                return `${m} 分 ${s} 秒`;
            }
            return `${s} 秒`;
        }

        function formatSummaryDuration(seconds) {
            if (!seconds || seconds <= 0) return '0 小時';
            const hours = seconds / 3600;
            return `${hours >= 10 ? Math.round(hours) : hours.toFixed(1)} 小時`;
        }

        async function init() {
            try {
                // 讀取 room_posts 中 kind == 'live-clip' 且排除 access_type == 'all'
                const { data, error } = await supabaseClient
                    .from('room_posts')
                    .select('*')
                    .eq('kind', 'live-clip')
                    .neq('access_type', 'all')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allLiveClips = data || [];

                buildMonthChips();
                applyMonthFilter();
            } catch (err) {
                console.error("載入失敗:", err);
                document.getElementById('clips-timeline-container').innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-circle-exclamation" style="font-size:36px;margin-bottom:12px;"></i>
                        <p>載入失敗: ${err.message}</p>
                    </div>
                `;
            }
        }

        // 建立動態月份選單
        function buildMonthChips() {
            const months = new Set();
            allLiveClips.forEach(post => {
                if (post.created_at) {
                    const date = new Date(post.created_at);
                    months.add(`${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`);
                }
            });

            const sortedMonths = Array.from(months).sort().reverse();
            const dropdown = document.getElementById('month-dropdown');
            dropdown.innerHTML = `<option value="all">所有月份</option>` + sortedMonths.map(m => {
                const [y, mm] = m.split('-');
                return `<option value="${m}">${y} 年 ${parseInt(mm)} 月</option>`;
            }).join('');
        }

        // 選擇月份
        function selectMonth(monthStr) {
            selectedMonth = monthStr;
            const dropdown = document.getElementById('month-dropdown');
            if (dropdown) dropdown.value = monthStr || 'all';
            applyMonthFilter();
        }

        // 切換排序方式
        function setSort(type) {
            sortBy = type;
            document.getElementById('sort-count-btn').classList.toggle('active', type === 'count');
            document.getElementById('sort-duration-btn').classList.toggle('active', type === 'duration');
            calculateMemberStats();
            renderSidebar();
        }

        // 應用月份篩選
        function applyMonthFilter() {
            if (selectedMonth) {
                monthFilteredClips = allLiveClips.filter(post => {
                    if (!post.created_at) return false;
                    const date = new Date(post.created_at);
                    const yyyyMm = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                    return yyyyMm === selectedMonth;
                });
            } else {
                monthFilteredClips = allLiveClips;
            }

            // 更新頂部總時長與總次數
            const totalSec = monthFilteredClips.reduce((sum, p) => sum + (p.duration || 0), 0);
            document.getElementById('total-live-clips').innerText = monthFilteredClips.length;
            document.getElementById('total-live-duration').innerText = formatSummaryDuration(totalSec);

            calculateMemberStats();
            renderSidebar();
            renderTimeline({ reset: true });
        }

        // 計算成員直播次數與總時長 (解析 videoItem.channels)
        function calculateMemberStats() {
            const counts = {};
            const durations = {};
            const meta = {};

            monthFilteredClips.forEach(post => {
                const postDuration = post.duration || 0;
                const channels = post.channels || [];

                if (channels.length === 0) {
                    const name = post.author_name || 'Artist';
                    counts[name] = (counts[name] || 0) + 1;
                    durations[name] = (durations[name] || 0) + postDuration;
                    if (!meta[name]) meta[name] = { avatar: post.author_avatar, color: '#8b5cf6' };
                } else {
                    channels.forEach(ch => {
                        const name = ch.name || post.author_name;
                        if (name) {
                            counts[name] = (counts[name] || 0) + 1;
                            durations[name] = (durations[name] || 0) + postDuration;
                            if (!meta[name]) {
                                meta[name] = {
                                    avatar: ch.profileImageUrl || post.author_avatar,
                                    color: ch.primaryColorHex || '#8b5cf6'
                                };
                            }
                        }
                    });
                }
            });

            memberStats = Object.entries(counts)
                .map(([name, count]) => ({
                    name,
                    count,
                    durationSec: durations[name] || 0,
                    avatar: meta[name] ? meta[name].avatar : '',
                    color: meta[name] ? meta[name].color : '#8b5cf6'
                }))
                .sort((a, b) => {
                    if (sortBy === 'duration') {
                        return b.durationSec - a.durationSec;
                    }
                    return b.count - a.count;
                });

            document.getElementById('total-members-count').innerText = memberStats.length;

            // 動態更新頂部成員下拉選單
            const dropdown = document.getElementById('member-dropdown');
            if (dropdown) {
                let optionsHtml = `<option value="all" ${selectedMember === null ? 'selected' : ''}>全體成員 (所有直播)</option>`;
                optionsHtml += memberStats.map(m => `
                    <option value="${m.name}" ${selectedMember === m.name ? 'selected' : ''}>${m.name} (${m.count} 次)</option>
                `).join('');
                dropdown.innerHTML = optionsHtml;
            }
        }

        // 渲染側邊欄成員排行榜
        function renderSidebar() {
            const container = document.getElementById('member-list-container');
            const totalSec = monthFilteredClips.reduce((sum, p) => sum + (p.duration || 0), 0);

            let html = `
                <div class="member-item ${selectedMember === null ? 'active' : ''}" onclick="selectMember(null)">
                    <div class="rank-num"><i class="fa-solid fa-users"></i></div>
                    <div class="member-info">
                        <div class="member-name-text">全體成員 (所有直播)</div>
                        <div class="member-sub-info">總時長: ${formatDuration(totalSec)}</div>
                    </div>
                    <div class="clip-count-badge">
                        <div class="badge-main">${monthFilteredClips.length} 次</div>
                    </div>
                </div>
            `;

            html += memberStats.map((m, idx) => `
                <div class="member-item ${selectedMember === m.name ? 'active' : ''}" onclick="selectMember('${m.name}')">
                    <div class="rank-num ${idx < 3 ? 'rank-' + (idx + 1) : ''}">${idx + 1}</div>
                    <img class="member-avatar" src="${m.avatar}" style="border-color:${m.color}" alt="${m.name}" onerror="this.src='https://via.placeholder.com/42'">
                    <div class="member-info">
                        <div class="member-name-text">${m.name}</div>
                        <div class="member-sub-info">時長: ${formatDuration(m.durationSec)}</div>
                    </div>
                    <div class="clip-count-badge">
                        <div class="badge-main" style="color:${m.color}">${m.count} 次</div>
                    </div>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        let activeMobileTab = 'timeline';

        // 手機版分頁切換
        function switchMobileTab(tab) {
            activeMobileTab = tab;
            const layout = document.getElementById('main-layout');
            const btnTimeline = document.getElementById('mtab-timeline');
            const btnLeaderboard = document.getElementById('mtab-leaderboard');

            if (tab === 'leaderboard') {
                layout.classList.add('show-leaderboard');
                if (btnLeaderboard) btnLeaderboard.classList.add('active');
                if (btnTimeline) btnTimeline.classList.remove('active');
            } else {
                layout.classList.remove('show-leaderboard');
                if (btnTimeline) btnTimeline.classList.add('active');
                if (btnLeaderboard) btnLeaderboard.classList.remove('active');
            }
        }

        // 點擊選擇成員
        function selectMember(name) {
            selectedMember = name;

            // 同步下拉選單的值
            const dropdown = document.getElementById('member-dropdown');
            if (dropdown) {
                dropdown.value = name || 'all';
            }

            // 在手機上點選成員時，自動跳轉回「直播時間紀錄」分頁
            if (window.innerWidth <= 768) {
                switchMobileTab('timeline');
            }

            renderSidebar();
            renderTimeline({ reset: true });
        }

        function loadMoreClips() {
            visibleClipCount += PAGE_SIZE;
            renderTimeline();
        }

        // 渲染右側 Live-Clip 時間列表
        function renderTimeline({ reset = false } = {}) {
            const container = document.getElementById('clips-timeline-container');
            const titleEl = document.getElementById('current-filter-title');
            const resultCount = document.getElementById('timeline-result-count');
            const loadMoreButton = document.getElementById('load-more-clips');
            const monthText = selectedMonth ? `${selectedMonth.split('-')[0]}年${parseInt(selectedMonth.split('-')[1])}月` : '所有月份';

            titleEl.innerHTML = selectedMember
                ? `<i class="fa-solid fa-user-check"></i> ${selectedMember} 參與的 Live-Clip 紀錄 (${monthText})`
                : `<i class="fa-solid fa-clock-rotate-left"></i> Live-Clip 時間紀錄 (${monthText})`;

            const filteredClips = monthFilteredClips.filter(post => {
                if (!selectedMember) return true;
                const channels = post.channels || [];
                return channels.length > 0 ? channels.some(ch => ch.name === selectedMember) : post.author_name === selectedMember;
            });

            if (reset) visibleClipCount = PAGE_SIZE;
            const visibleClips = filteredClips.slice(0, visibleClipCount);
            resultCount.textContent = `顯示 ${visibleClips.length} / ${filteredClips.length} 筆`;
            loadMoreButton.hidden = visibleClips.length >= filteredClips.length;

            if (filteredClips.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-video-slash" style="font-size:36px;margin-bottom:12px;"></i><p>尚無符合條件的 Live-Clip 紀錄</p></div>`;
                return;
            }

            container.innerHTML = visibleClips.map(post => {
                const dateStr = post.created_at ? new Date(post.created_at).toLocaleString('zh-TW', {
                    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', weekday: 'short'
                }) : '';
                const channels = post.channels || [];
                const members = channels.length ? channels : [{ name: post.author_name || 'Artist', primaryColorHex: '#8b5cf6' }];

                return `
                    <article class="clip-row">
                        <div class="clip-details">
                            <div class="clip-header-row" style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                                <div class="clip-date"><i class="fa-regular fa-calendar"></i> ${dateStr}</div>
                                <div class="duration-pill" style="background:rgba(139, 92, 246, 0.2); color:#c084fc; border:1px solid rgba(139, 92, 246, 0.4); font-size:0.78rem; font-weight:700; padding:3px 10px; border-radius:12px; display:flex; align-items:center; gap:4px;">
                                    <i class="fa-solid fa-stopwatch"></i> ${formatDuration(post.duration)}
                                </div>
                            </div>
                            <div class="clip-text-content clip-content-line">${post.content || 'Live 直播紀錄'}</div>
                            <div class="clip-participating-members clip-member-summary">
                                ${members.slice(0, 3).map(ch => `<span class="member-tag" onclick="selectMember('${ch.name}')" style="cursor:pointer;" title="點擊篩選 ${ch.name}"><span class="member-dot" style="background:${ch.primaryColorHex || '#8b5cf6'}"></span>${ch.name}</span>`).join('')}
                                ${members.length > 3 ? `<span class="member-tag">+${members.length - 3}</span>` : ''}
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
